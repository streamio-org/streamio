name: Feature request
description: Suggest an idea or improvement for this project
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Is your feature request related to a problem?
      description: A clear description of what the problem is, e.g. "I'm always frustrated when [...]".
    validations:
      required: false

  - type: textarea
    id: solution
    attributes:
      label: Describe the solution you'd like
      description: What you want to happen.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Describe alternatives you've considered
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Mockups, links to similar features elsewhere, how big a change you think this is.
    validations:
      required: false

  - type: markdown
    attributes:
      value: |
        ---
        Note: for anything larger than a small fix, it helps to open the issue before starting work so we can talk through the approach together.
