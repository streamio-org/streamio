<!-- public/reset-password.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset Password - Streamio</title>
  <link rel="shortcut icon" href="/icons/site-icon.png" type="image/x-icon">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles/auth-pages.css" />
</head>
<body>

  <div class="bg-canvas"></div>
  <div class="bg-grid"></div>

  <nav><a href="/" class="brand">STREAMIO</a></nav>

  <main>
    <div class="auth-card">

      <div class="panel active" id="panelForm">
        <h1 class="auth-heading">Reset password</h1>
        <p class="auth-sub">Choose a new password for your account.</p>

        <div class="error-msg" id="formError"></div>

        <form id="form">
          <!-- Shown only when the URL carries no token. The emailed link points at
               whatever public URL the server had when it was sent, and behind the
               Cloudflare tunnel that host changes on every restart — so the email
               also prints the code, and it can be pasted here from the current URL. -->
          <div class="field" id="tokenRow" hidden>
            <label class="field-label" for="token">Reset code</label>
            <input class="field-input code-input" id="token" type="text"
                   placeholder="Paste the code from your email"
                   autocomplete="off" spellcheck="false" autocapitalize="off" />
          </div>

          <div class="field">
            <label class="field-label" for="password">New password</label>
            <div class="pw-wrap">
              <input class="field-input" id="password" type="password"
                     placeholder="Min. 8 characters" minlength="8" required
                     autocomplete="new-password" />
              <button class="pw-toggle" type="button" data-toggle="password"
                      aria-label="Show password" aria-pressed="false">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                     stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7Z" />
                  <circle cx="12" cy="12" r="3" />
                </svg>
              </button>
            </div>
          </div>

          <div class="pw-meter" id="pwMeter" data-score="0">
            <div class="pw-meter-bars"><span></span><span></span><span></span></div>
            <span class="pw-meter-label" id="pwMeterLabel"></span>
          </div>

          <div class="field">
            <label class="field-label" for="confirm">Confirm password</label>
            <div class="pw-wrap">
              <input class="field-input" id="confirm" type="password"
                     placeholder="Repeat your new password" required
                     autocomplete="new-password" />
              <button class="pw-toggle" type="button" data-toggle="confirm"
                      aria-label="Show password" aria-pressed="false">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                     stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7Z" />
                  <circle cx="12" cy="12" r="3" />
                </svg>
              </button>
            </div>
          </div>

          <button class="btn-submit" type="submit" id="submitBtn">Reset password</button>
        </form>

        <div class="auth-footer"><a href="/login">← Back to sign in</a></div>
      </div>

      <div class="panel panel-centered" id="panelSuccess">
        <div class="status-badge">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
               stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M20 6 9 17l-5-5" />
          </svg>
        </div>
        <h1 class="auth-heading">Password updated</h1>
        <p class="auth-sub">You can sign in with your new password now.</p>
        <a class="btn-submit" href="/login">Go to sign in</a>
        <p class="redirect-note" id="redirectNote"></p>
      </div>

    </div>
  </main>

  <script src="/scripts/reset-password.js" type="module"></script>
</body>
</html>
