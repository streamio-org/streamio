<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Streamio - Search</title>
  <link rel="shortcut icon" href="/icons/site-icon.png" type="image/x-icon">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles/search.css" />
</head>
<body>
  <nav>
    <a href="/" class="brand">STREAMIO</a>
    <ul class="nav-links">
      <li><a href="/">Home</a></li>
      <li><a href="/catalog">Catalog</a></li>
      <li><a href="/search" class="active">Search</a></li>
      <li><a href="/providers">Providers</a></li>
      <li><a href="/rooms">Rooms</a></li>
      <li><a href="/account">Account</a></li>
    </ul>
  </nav>

  <div class="page-wrap">
    <div class="search-hero">
      <h1>Search</h1>
      <p>Find any movie or show by title, or browse by genre</p>
      <div class="search-box">
        <div class="search-icon"><svg class="icon-svg" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg></div>
        <input type="search" class="search-input" id="searchInput" placeholder="Search titles…" autocomplete="off" />
        <button class="search-btn" id="searchBtn">Search</button>
      </div>
    </div>

    <div class="facets">
      <section class="facet">
        <h2 class="facet-label">Provider</h2>
        <div class="chip-row" id="providerChips"></div>
        <!-- Only populated when the selected source exists in more than one
             language; empty and hidden otherwise. -->
        <div class="chip-row lang-row" id="providerLangChips" style="display:none"></div>
      </section>

      <section class="facet" id="genreSection" style="display:none">
        <h2 class="facet-label">Genre</h2>
        <div class="chip-row" id="genreChips"></div>
      </section>

      <section class="facet" id="recentSection" style="display:none">
        <h2 class="facet-label">Recent searches</h2>
        <div class="chip-row" id="recentChips"></div>
      </section>
    </div>

    <div class="filter-bar" id="filterBar" style="display:none">
      <div class="filter-heading">
        <span class="results-title" id="resultsTitle"></span>
        <span class="results-count" id="resultsCount"></span>
      </div>
      <div class="filter-controls">
        <div class="segmented" role="group" aria-label="Filter by type">
          <button data-type="all" class="active">All</button>
          <button data-type="movie">Movies</button>
          <button data-type="tv">Series</button>
        </div>
        <label class="sort-field">
          <span>Sort</span>
          <select id="sortSelect">
            <option value="relevance">Relevance</option>
            <option value="title">Title A–Z</option>
            <option value="rating">Rating</option>
            <option value="year">Year</option>
          </select>
        </label>
      </div>
    </div>

    <div class="results-area" id="resultsArea"></div>

    <div class="load-more-wrap" id="loadMoreWrap" style="display:none">
      <button class="load-more-btn" id="loadMoreBtn">Load more</button>
    </div>
  </div>

  <!-- BOTTOM NAV (mobile) -->
  <div class="bottom-nav" aria-label="Mobile navigation" role="navigation">
    <a href="/" class="bottom-nav-item">
      <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      Home
    </a>
    <a href="/catalog" class="bottom-nav-item">
      <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
      Catalog
    </a>
    <a href="/search" class="bottom-nav-item active">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      Search
    </a>
    <a href="/providers" class="bottom-nav-item">
      <svg viewBox="0 0 24 24"><polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2" ry="2"/></svg>
      Providers
    </a>
    <a href="/account" class="bottom-nav-item">
      <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      Account
    </a>
  </div>

  <script src="/scripts/search.js" type="module"></script>
</body>
</html>
